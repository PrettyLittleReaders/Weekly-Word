<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>📚 PLR Weekly Word</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Libre+Baskerville&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Libre Baskerville',serif;

  background:
    radial-gradient(circle at top, rgba(255,230,180,.35), transparent 40%),
    linear-gradient(135deg,#2b1f1a,#4b3832,#241815);

  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
overflow-x:hidden;
padding:20px 10px;
box-sizing:border-box;
  position:relative;
}

/* subtle floating glow */
body::before{
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  background:radial-gradient(circle, rgba(255,215,140,.15), transparent 70%);
  top:-200px;
  right:-200px;
  filter:blur(30px);
  animation:floatGlow 8s ease-in-out infinite alternate;
  z-index:0;
}

@keyframes floatGlow{
  from{transform:translateY(0px)}
  to{transform:translateY(30px)}
}

.app{
  width:100%;
  max-width:420px;
  padding:24px;
  text-align:center;

  background:rgba(255,248,235,0.12);
  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.15);

  border-radius:24px;

  box-shadow:
    0 10px 40px rgba(0,0,0,.45),
    inset 0 1px 1px rgba(255,255,255,.15);

  position:relative;
  z-index:2;
}

h2,h3{
  font-family:'Playfair Display',serif;
  color:#fff3dc;
  text-shadow:0 2px 10px rgba(0,0,0,.4);
  letter-spacing:1px;
}

input,button{
  padding:12px;
  font-size:16px;
  margin:6px 0;
  width:100%;
  border-radius:12px;
  border:none;
  box-sizing:border-box;
}

input{
  background:rgba(255,255,255,.9);
  color:#3b2b24;
}

button{
  background:linear-gradient(135deg,#8b5e3c,#6b4f4f);
  color:#fff;
  cursor:pointer;
  font-weight:bold;

  transition:.25s;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}

button:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 8px 18px rgba(0,0,0,.35);
}

/* board rows */
.grid{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:8px 0;
  flex-wrap:nowrap;
}

.tile{
  width:clamp(30px, 9vw, 50px);
  height:clamp(30px, 9vw, 50px);

  display:flex;
  justify-content:center;
  align-items:center;

  font-weight:bold;

  font-size:clamp(14px, 4.5vw, 22px);

  border-radius:10px;
  background:rgba(255,255,255,.12);
  color:white;
  border:1px solid rgba(255,255,255,.15);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.08),
    0 4px 10px rgba(0,0,0,.25);
}

.correct{
  background:linear-gradient(135deg,#7bc96f,#5ca85c);
  color:#fff;
}

.present{
  background:linear-gradient(135deg,#e7c85b,#c9a93e);
  color:#fff;
}

.absent{
  background:linear-gradient(135deg,#a84e4e,#7b3838);
  color:#fff;
}

.flip{
  animation: flipAnim 0.5s ease;
}

@keyframes flipAnim{
  0%{transform:rotateX(0)}
  50%{transform:rotateX(90deg)}
  100%{transform:rotateX(0)}
}

.shake{
  animation:shake .4s
}

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-5px)}
  100%{transform:translateX(0)}
}

.keyboard{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(28px, 1fr));
  gap:6px;
  margin-top:14px;
}

.key{
  padding:10px 0;
  border-radius:8px;

  background:rgba(255,255,255,.15);
  color:white;

  border:1px solid rgba(255,255,255,.08);

  transition:.2s;

  font-size:clamp(10px, 3.5vw, 14px);
}

.key:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.25);
}

#message{
  color:#fff3dc;
  margin-top:10px;
  font-weight:bold;
}

/* popup polish */
#popup div{
  background:linear-gradient(145deg,#fff7eb,#f2e1c2) !important;
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.5);
}

#popup h3{
  color:#4b3832;
  text-shadow:none;
}
 /* Falling Pages */
.pages{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  overflow:hidden;
  pointer-events:none;
  z-index:1;
}

.page{
  position:absolute;
  top:-60px;

  width:28px;
  height:38px;

  background:linear-gradient(to bottom,#fffdf7,#f2e6c9);

  border-radius:3px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.15),
    inset 0 0 2px rgba(0,0,0,.15);

  opacity:.75;

  animation:fall linear forwards;
}

.page::before{
  content:"";
  position:absolute;
  left:5px;
  top:7px;

  width:18px;
  height:2px;

  background:rgba(120,90,50,.25);

  box-shadow:
    0 6px rgba(120,90,50,.18),
    0 12px rgba(120,90,50,.18),
    0 18px rgba(120,90,50,.18);
}

@keyframes fall{
  0%{
    transform:
      translateY(-60px)
      rotate(0deg);
  }

  100%{
    transform:
      translateY(120vh)
      rotate(360deg);
    opacity:0;
  }
}

#popup{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;

  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(8px);
}

#popup.show{
  display:flex;
}

#popup > div{
  background:linear-gradient(145deg,#fff7eb,#f2e1c2);
  padding:20px;
  border-radius:12px;
  text-align:center;
  width:80%;
  max-width:300px;
  box-shadow:0 12px 40px rgba(0,0,0,.4);
} 
  
</style>
</head>
<body>
  
<div class="pages" id="pages"></div>

<div class="app">

<div id="start">
<h2>📚PLR Weekly Word📚</h2>
<input id="nameInput" placeholder="Enter your name" />
<button type="button" onclick="startGame()">Start</button>
</div>

<div id="game" style="display:none;">
<h3 id="welcome"></h3>
<div id="board"></div>
<input id="guessInput" placeholder="Enter guess" />
<button onclick="submitGuess()">Guess</button>
<div id="keyboard" class="keyboard"></div>
<p id="message"></p>
<button id="shareBtn" style="display:none;" onclick="shareResults()">Share Results</button>
</div>

</div>

<script>
const WORDS = [
"book","page","word","read","story","novel","poem","author","cover","spine","theme","group","reader","readers","thriller","mystery","fiction","fantasy","romance","horror","Scifi","History","crime","poetry","adult","fable","spine","cover","shelf","stack","cocoa","mocha","fruit","candy","quilt","chips","toast","socks","couch","chair","write","writer","legend","mythic","novel","editor","coffee","muffin","bagel","pastry","sweets","pillow","cushy","latte",
"text","write","paper","pen","plot","title","index","print","shelf","quote","lounge","cozy","window","quiet","silent","reflect","spine","cover","blurb","secret","secrets","bookend",
"line","tale","verse","rhyme","genre","draft","edit","bind","ink","story","candle","chair",
"library","fiction","reader","writer","editor","prose","script","volume","series","chapter","bookmark","binding","publish","imprint","classic","legend","mythic","narrate","dialog","monolog","foreword","epilog","preface","glossary","catalog","archive","journal","essay","review","scribe","codex","folio","quarto","scroll","stanza","syntax","lexicon","motif","trope","canon","fable","parable","sonnet","haiku","satire","irony","symbol","scribe","script","imprint","preface","epilog","prolog","archive","catalog","journal","monolog","codex","folio","scroll","prolog","epilog","trope","canon","fable","irony","theme","symbol","voice","subplot","pacing","plotline","verse","margins","plot","groups","evening","daytime","relax","unwind"
];

let name="";
let target="";
let guesses=[];
let gameOver=false;

const MAX_ROWS=5;
let WORD_LENGTH=0;

function getWeekKey(){
  const now = new Date();
  const day = now.getDay();
  const diff = (day >= 2) ? day - 2 : day + 5;
  const tuesday = new Date(now);
  tuesday.setDate(now.getDate() - diff);
  tuesday.setHours(0,0,0,0);
  return tuesday.getTime();
}

function getWeeklyWord() {
    const weekNumber = Math.floor(getWeekKey() / (7 * 24 * 60 * 60 * 1000));
    return WORDS[weekNumber % WORDS.length];
}

function startGame(){
 name=document.getElementById("nameInput").value;
 if(!name)return;

 const saved = JSON.parse(localStorage.getItem("bookish-wordle") || "null");
 const week=getWeekKey();

 if(saved && saved.week===week){
  target=saved.target;
  guesses=saved.guesses;
  gameOver=saved.gameOver;
 }else{
  target=getWeeklyWord();
  guesses=[];
  gameOver=false;
  saveGame();
 }

 document.getElementById("start").style.display="none";
 document.getElementById("game").style.display="block";
 document.getElementById("welcome").innerText=`Welcome, ${name}`;

 WORD_LENGTH = target.length;
 document.getElementById("guessInput").maxLength = WORD_LENGTH;

 renderBoard();
 createKeyboard();
}

function saveGame(){
 localStorage.setItem("bookish-wordle",JSON.stringify({week:getWeekKey(),target,guesses,gameOver}));
}

function getTileClass(letter,index,guess){
 if(target[index]===letter)return"correct";
 if(target.includes(letter))return"present";
 return"absent";
}

function renderBoard(){
 const board=document.getElementById("board");
 board.innerHTML="";

 for(let r=0;r<MAX_ROWS;r++){
  const row=document.createElement("div");
  row.className="grid";
  const guess=guesses[r] || "";

  for(let c=0;c<WORD_LENGTH;c++){
    const tile=document.createElement("div");
    tile.className="tile";
    const letter=guess[c] || "";
    tile.innerText=letter;

    if(guess){
      setTimeout(()=>{
        tile.classList.add("flip");
        tile.classList.add(getTileClass(letter,c,guess));
      },c*150);
    }

    row.appendChild(tile);
  }

  board.appendChild(row);
 }
}

function submitGuess(){
 if(gameOver)return;

 const input=document.getElementById("guessInput");
 const guess=input.value.trim().toLowerCase();

 if(guess.length!==WORD_LENGTH){
  input.classList.add("shake");
  setTimeout(()=>input.classList.remove("shake"),400);
  return;
 }

 guesses.push(guess);
 input.value="";

 renderBoard();
 updateKeyboard(guess);

 if(guess===target || guesses.length===MAX_ROWS){
  endGame();
 }

 saveGame();
}

function endGame(){
 gameOver=true;
 const msg=document.getElementById("message");
 const shareBtn=document.getElementById("shareBtn");

 if(guesses.includes(target)){
  const tries=guesses.indexOf(target)+1;
  msg.innerText=`Solved in ${tries}/5 tries!`;
 }else{
  msg.innerText=`Word was: ${target}`;
 }

 shareBtn.style.display="block";
 saveGame();
}

function createKeyboard(){
 const letters="abcdefghijklmnopqrstuvwxyz";
 const kb=document.getElementById("keyboard");
 kb.innerHTML="";

 letters.split("").forEach(l=>{
  const key=document.createElement("div");
  key.innerText=l;
  key.className="key";
  key.onclick=()=>{document.getElementById("guessInput").value+=l;};
  kb.appendChild(key);
 });
}

function updateKeyboard(guess){
 document.querySelectorAll(".key").forEach(key=>{
  const letter = key.innerText;

  if(guess.includes(letter)){
    if(key.classList.contains("correct")) return;

    if([...target].some((l,i)=>l===letter && guess[i]===letter)){
      key.style.background = "#6aaa64";
      key.classList.add("correct");
    } else if(target.includes(letter)){
      key.style.background = "#c9b458";
    } else {
      key.style.background = "#787c7e";
    }
  }
 });
}

function shareResults(){
  const popup = document.getElementById("popup");
  const popupText = document.getElementById("popupText");

  const today = new Date().toLocaleDateString();
  const result = guesses.includes(target)
    ? guesses.indexOf(target)+1
    : "X";

  popupText.innerHTML = `
    <b>${name}</b><br><br>
    Great Job! 📖✨<br><br>
    Score: ${result}/5<br>
    Date: ${today}
  `;

  popup.classList.add("show");
}

function copyResults(){
  const today = new Date().toLocaleDateString();
  const result = guesses.includes(target)
    ? guesses.indexOf(target)+1
    : "X";

  const text = `${name}'s Bookish Wordle
${result}/
${today}`;

  navigator.clipboard.writeText(text);
  alert("Copied! 📖✨");
}

function createPage(){
  const page = document.createElement("div");
  page.className = "page";

  page.style.left = Math.random() * window.innerWidth + "px";

  const size = 20 + Math.random() * 18;

  page.style.width = size + "px";
  page.style.height = size * 1.3 + "px";

  page.style.animationDuration =
    6 + Math.random() * 8 + "s";

  page.style.opacity =
    0.3 + Math.random() * 0.5;

  page.style.transform =
    `rotate(${Math.random()*360}deg)`;

  document.getElementById("pages").appendChild(page);

  setTimeout(()=>{
    page.remove();
  },14000);
}

setInterval(createPage,700);
  
function closePopup(){
  document.getElementById("popup").classList.remove("show");
}
</script>

<div id="popup">
  <div>
    <h3>📚 Results</h3>
    <p id="popupText"></p>
    <button onclick="copyResults()">Copy</button>
    <button onclick="closePopup()">Close</button>
  </div>
</div>  
  
</body>
</html>
